apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dvn-workshop
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-prd
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dvn-workshop
    app.kubernetes.io/managed-by: kustomize
    environment: prd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-prd
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
