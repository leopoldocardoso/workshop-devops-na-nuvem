apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dvn-workshop
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend-prd
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dvn-workshop
    app.kubernetes.io/managed-by: kustomize
    environment: prd
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: backend-prd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: backend-prd
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: dvn-workshop
        app.kubernetes.io/managed-by: kustomize
        environment: prd
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
              app.kubernetes.io/instance: backend-prd
      securityContext:
        runAsNonRoot: true
        # A imagem usa `USER $APP_UID` (= 1654 nas imagens oficiais aspnet:8.0);
        # fixamos o UID para que o kubelet consiga verificar runAsNonRoot.
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          readinessProbe:
            httpGet:
              path: /backend/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /backend/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Exceção da rule (seção 7): o runtime .NET usa /tmp para arquivos
            # temporários (compilação de views, diagnostics IPC); com
            # readOnlyRootFilesystem precisa de um emptyDir gravável só aqui.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
