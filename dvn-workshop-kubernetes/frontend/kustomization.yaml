apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml
- pod-disruption-budget.yaml

# Fonte única da versão implantada: a tag da imagem e a label
# app.kubernetes.io/version são definidas AQUI, nunca nos manifestos.
# Para promover uma nova versão:
#   kustomize edit set image frontend=659942169599.dkr.ecr.us-east-1.amazonaws.com/dvn-workshop/production/frontend:vX.Y
# e atualize o valor de app.kubernetes.io/version abaixo no mesmo commit.
images:
- name: frontend
  newName: 659942169599.dkr.ecr.us-east-1.amazonaws.com/dvn-workshop/production/frontend
  newTag: v1.0

labels:
- includeTemplates: true
  pairs:
    app.kubernetes.io/version: v1.0
